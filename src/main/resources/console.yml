# ║        EligiusConnector - Console Relay           ║
# ╚══════════════════════════════════════════════════╝

# Discord channel where server logs are streamed and commands can be executed
channel: "1521272226442383440"

# How often (seconds) to poll latest.log for new lines
poll_interval: 2

# Commands that cannot be executed from Discord
command_blacklist:
  - "say"
  - "gamemode"
  - "op"
  - "deop"
