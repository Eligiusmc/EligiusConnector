# ╔══════════════════════════════════════════════════╗
# ║        EligiusConnector - Synchronization        ║
# ║  Bidirectional sync: MC groups ↔ Discord roles   ║
# ║  Uses Vault/LuckPerms for group detection        ║
# ╚══════════════════════════════════════════════════╝

# Master switch — set to false to disable all sync
enabled: true

# Role sync: mirrors Minecraft LuckPerms groups to Discord roles
# When a player has a mapped group in MC, they get the Discord role.
# When the group is removed, the Discord role is removed too.
roles:
  enabled: true
  interval: 30               # Sync interval (seconds)
  mapping:
    verified: "1521342858945101894"
    # testing: "ROLE_ID_HERE"
    # vip: "ROLE_ID_HERE"

# Sync Minecraft player name → Discord member nickname
nickname:
  enabled: true
  interval: 30                # Sync interval (seconds)
  format: "%player_name%"     # Nickname format (supports placeholders)
