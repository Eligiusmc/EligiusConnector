# ╔══════════════════════════════════════════════════╗
# ║        EligiusConnector - Chat Bridge             ║
# ╚══════════════════════════════════════════════════╝

# Discord channel for MC ↔ DC messages
channel: "1521272219223851028"

# Direction control
bridge:
  mc_to_discord: true      # Minecraft chat → Discord
  discord_to_mc: true      # Discord → Minecraft chat

# Message format
# Placeholders: {player}, {message}, {displayname}
format:
  mc_to_discord: "{player}: {message}"
  discord_to_mc: "[DC] {player}: {message}"

# Webhook for MC → Discord (shows player head + nickname)
webhook:
  enabled: true
  name: "Minecraft"
  avatar: "https://minotar.net/avatar/%player_name%/128"

# Chat filter — blocks spam, profanity, links, and caps abuse
# Set filter.enabled: false to disable all filters at once
filter:
  enabled: true

  spam:
    enabled: true
    max_messages: 5         # Messages allowed in time_window_seconds
    time_window_seconds: 10 # Window to count messages before triggering

  profanity:
    enabled: true
    words:
      - "fuck"
      - "shit"
      - "damn"
      - "ass"
      - "asshole"
      - "bitch"
      - "bastard"
      - "dick"
      - "crap"
      - "piss"
      - "stupid"
      - "idiot"
      - "moron"
      - "suck"
      - "sucks"

  links:
    enabled: true
    # whitelist = only listed domains allowed, rest blocked
    # blacklist = listed domains blocked, rest pass
    mode: "whitelist"
    domains:
      - "youtube.com"
      - "youtu.be"
      - "twitch.tv"
      - "clips.twitch.tv"
      - "github.com"
      - "discord.com"
      - "discord.gg"
      - "minecraft.net"
      - "mojang.com"
      - "papermc.io"
      - "spigotmc.org"
      - "bukkit.org"

  caps:
    enabled: true
    max_percentage: 70      # % of uppercase characters to trigger
    min_length: 10          # Minimum message length to check

  # Escalating punishments for repeat offenders
  # Actions: warn | delete | mute:<seconds> | tempban:<seconds> | banip
  # 1st violation always = warn (sends blocked message)
  punishment:
    enabled: true
    thresholds:
      2: "mute:300"         # 2+ violations → 5 min mute
      5: "tempban:3600"     # 5+ violations → 1 hour ban
      10: "banip"           # 10+ violations → IP ban
