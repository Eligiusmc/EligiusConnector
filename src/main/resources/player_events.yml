# ╔══════════════════════════════════════════════════╗
# ║        EligiusConnector - Player Events          ║
# ║  Placeholders: {player}, {online}, {max}         ║
# ║  Death: {death_message}, {health}, {food}, {world} ║
# ║  Advancement: {advancement}                      ║
# ╚══════════════════════════════════════════════════╝

join:
  enabled: true
  channel: "1521276575889358960"
  embed:
    color: 5763719
    author: "{player} joined the server"
    author_icon: "https://minotar.net/avatar/{player}/128"
    thumbnail: "https://minotar.net/avatar/{player}/128"
    title: "Welcome to EligiusMC!"
    description: "Everyone say hello to **{player}**!"
    footer: "EligiusMC"
    timestamp: true
    fields:
      - name: "Online"
        value: "**{online}** / **{max}**"
        inline: true
      - name: "First Time"
        value: "{first_join}"
        inline: true

leave:
  enabled: true
  channel: "1521276575889358960"
  embed:
    color: 15548997
    author: "{player} left the server"
    author_icon: "https://minotar.net/avatar/{player}/128"
    thumbnail: "https://minotar.net/avatar/{player}/128"
    title: "See you soon!"
    description: "**{player}** has left. Come back anytime!"
    footer: "EligiusMC"
    timestamp: true
    fields:
      - name: "Online"
        value: "**{online}** / **{max}**"
        inline: true

death:
  enabled: true
  channel: "1521276578708066578"
  embed:
    color: 15548997
    author: "{player} died"
    author_icon: "https://minotar.net/avatar/{player}/128"
    thumbnail: "https://minotar.net/avatar/{player}/128"
    title: "{death_message}"
    footer: "EligiusMC"
    timestamp: true
    fields:
      - name: "Health"
        value: "❤️ {health} HP"
        inline: true
      - name: "Hunger"
        value: "🍖 {food} / 20"
        inline: true
      - name: "World"
        value: "🌍 {world}"
        inline: true

advancement:
  enabled: true
  channel: "1521276581522444350"
  embed:
    color: 16766720
    author: "Advancement Made!"
    author_icon: "https://minotar.net/avatar/{player}/128"
    thumbnail: "https://minotar.net/avatar/{player}/128"
    title: "{advancement}"
    description: "**{player}** has earned this advancement!"
    footer: "EligiusMC"
    timestamp: true
